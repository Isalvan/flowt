name: Firebase Hosting PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Forks must not receive deployment credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate and build
        uses: ./.github/actions/validate-frontend
      - name: Publish preview
        env:
          FIREBASE_SERVICE_ACCOUNT_FLOWT_63536: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLOWT_63536 }}
          FIREBASE_HOSTING_CHANNEL: pr-${{ github.event.pull_request.number }}
        run: node .github/scripts/firebase-hosting.mjs deploy
      - name: Publish preview link in PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/flowt-preview-comment.md"
