name: Run Flowt Tracker

on:
  schedule:
    - cron: '*/30 * * * *' # Ejecutar cada 30 minutos
  workflow_dispatch: # Permitir ejecucion manual desde la web de GitHub

permissions:
  contents: read

# A manual run must not overlap the scheduled one.
concurrency:
  group: run-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # A fresh copy of Flowt has no Gmail secrets yet: skip quietly instead of failing every 30 minutes.
      - name: Check configuration
        id: config
        env:
          GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
        run: |
          if [ -z "$GMAIL_TOKEN_BASE64" ]; then
            echo "::notice::El lector de Gmail no está configurado (falta GMAIL_TOKEN_BASE64). Ver docs/INSTALAR.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: |
          cd tracker-backend
          pip install -r requirements.txt

      - name: Create Secret Files
        if: steps.config.outputs.ready == 'true'
        # Secrets go through the environment, never into the script text, and the files are owner-only.
        env:
          GMAIL_CREDENTIALS_BASE64: ${{ secrets.GMAIL_CREDENTIALS_BASE64 }}
          GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          cd tracker-backend
          umask 077
          printf '%s' "$GMAIL_CREDENTIALS_BASE64" | base64 -d > credentials.json
          printf '%s' "$GMAIL_TOKEN_BASE64" | base64 -d > token.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 -d > serviceAccountKey.json

      - name: Run Tracker
        if: steps.config.outputs.ready == 'true'
        env:
          BANK_SENDER: ${{ secrets.BANK_SENDER }}
          UID_PROPIETARIO: ${{ secrets.UID_PROPIETARIO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          MAX_EMAILS_PER_RUN: 10
          MIN_CONFIDENCE: alta
          FLOWT_REVIEW_ENABLED: ${{ vars.FLOWT_REVIEW_ENABLED || 'false' }}
        run: |
          cd tracker-backend
          python main.py

      - name: Remove Secret Files
        if: always()
        run: rm -f tracker-backend/credentials.json tracker-backend/token.json tracker-backend/serviceAccountKey.json
