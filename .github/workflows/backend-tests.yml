name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Same interpreter as run_tracker.yml: the scheduled sync runs this code from main.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tracker-backend/requirements*
      - name: Install dependencies
        run: |
          python -m pip install -r tracker-backend/requirements.txt
          # The review service has its own extra dependencies; install them where they exist.
          if [ -f tracker-backend/requirements-review.in ]; then
            python -m pip install -r tracker-backend/requirements-review.in
          fi
      # Tests that need the Firestore emulator skip themselves when it is not running.
      - name: Test
        run: python -m pytest tracker-backend/tests -q
