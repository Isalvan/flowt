name: MCP Worker deploy

# Publishes the flowt-mcp Cloudflare Worker when its code reaches main.
# Pull requests that touch the Worker only build it (dry run), with no secrets.
on:
  push:
    branches: [main]
    paths:
      - 'mcp-worker/src/**'
      # Files the Worker bundles from outside mcp-worker/.
      - 'src/shared/allowedUids.json'
      - 'tracker-backend/prompts/categories.json'
      - 'tracker-backend/prompts/ticket_schema.json'
      - 'wrangler.json'
      - 'package-lock.json'
      - '.github/workflows/mcp-worker-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-worker/**'
      - 'src/shared/allowedUids.json'
      - 'tracker-backend/prompts/categories.json'
      - 'tracker-backend/prompts/ticket_schema.json'
      - 'wrangler.json'
      - 'package-lock.json'
      - '.github/workflows/mcp-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and do not cut one off halfway.
concurrency:
  group: mcp-worker-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

env:
  # Exact Wrangler version, so a new release cannot change a deploy unannounced.
  WRANGLER: wrangler@4.165.0
  WRANGLER_SEND_METRICS: 'false'

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The Worker's tests use in-memory fixtures only; nothing real is printed.
      - name: Test Worker
        run: npx vitest run mcp-worker/tests
      - name: Build Worker (dry run)
        if: github.event_name == 'pull_request'
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/mcp-worker"
      - name: Deploy Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying."
            exit 1
          fi
          # --keep-vars keeps any variables set in the Cloudflare dashboard.
          # Secrets (FIREBASE_SERVICE_ACCOUNT, GEMINI_API_KEY...) are never touched by a deploy.
          npx --yes "$WRANGLER" deploy --keep-vars
